name: interval_timer
description: "Interval timer app for structured workouts."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  drift: ^2.25.0
  sqlite3_flutter_libs: ^0.5.31
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.1
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  flutter_colorpicker: ^1.1.0
  table_calendar: ^3.2.0
  flutter_tts: ^4.2.5
  vibration: 3.2.0
  wakelock_plus: ^1.6.1
  flutter_local_notifications: ^22.0.1
  flutter_background_service: ^5.1.0
  live_activities: ^2.4.9
  permission_handler: ^12.0.3
  # F20: MediaStyle + setShowActionsInCompactView (FLN does not expose it).
  session_compact_notification:
    path: packages/session_compact_notification
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.25.0
  build_runner: ^2.4.15
  freezed: ^3.0.0
  fake_async: ^1.3.2

flutter:
  uses-material-design: true